# 모든 임계값·크기·모델명은 여기서 읽는다 (CLAUDE.md 10장).
model:
  name: yolo26x-seg.pt      # 2026-11-19 비교: yolo26x가 yolo11x보다 오검출 적음 (11x는 지붕을 truck으로 검출)
  weights_dir: models       # 처음 실행 시 자동 다운로드 (COCO 사전학습)
  imgsz: 1920               # 원본 폭 그대로. 1280 대비 먼 차 신뢰도 0.5~0.6 -> 0.8~0.9, 프레임당 약 120ms
  conf: 0.25
  classes: [2, 5, 7]        # COCO car, bus, truck
  dedup_ios: 0.85           # 작은 박스의 이 비율 이상이 큰 박스와 겹치면 중복 검출로 보고 신뢰도 낮은 쪽 제거

calibration:
  fix_k3: true             # k3 고정: 가장자리 발산 방지 (체커보드가 가장자리를 덜 덮을 때 필수)
  alpha: 1.0               # undistort: 1=원본 픽셀 모두 유지(검은 가장자리), 0=잘라냄

homography:
  ransac_thresh_m: 0.15   # 맵 좌표 기준(m). OpenCV 기본 3.0은 3m라 너무 느슨
  bev_margin_m: 15        # 탑뷰 범위 = 클릭한 점들의 범위 ± 이 값 (∩ 화면 가시 영역)

sampling:
  fps: 2                    # 1차 기본. 3차는 10 이상

geometry:
  slot_size_m: [2.48, 4.9]  # lotA 실측(2026-11-21): 선 중심 간격 2.48 (내부 2.31 + 선 0.17), 길이 4.9 (1행만 4.42)
  car_size_m: [1.8, 4.7]    # 2차 footprint용 표준 차 크기
  bev_px_per_m: 20

contact:
  mode: mask_bottom_center  # | bbox_bottom_center | bbox_center
  edge_margin_px: 2         # 박스가 좌·우·아래 경계에서 이 안이면 truncated
  depth_offset_m: 0.9       # 접점을 맵에서 카메라 반대쪽으로 미는 거리 (차 폭 절반). 0 = 원래 설계, 2026-11-22 tune clip 비교로 채택

occupancy:
  boundary_tol_m: 0.3       # 임시값: 칸 경계 허용 거리, 튜닝 clip에서 조정
  vis_judge: 0.7            # 가시 비율 >= 이면 판정
  vis_unknown: 0.3          # 가시 비율 < 이면 판단불가(-1)
  smooth_n: 5               # 시간 보정 다수결 프레임 수

footprint:                  # 2차
  enabled: false            # true면 칸 판정을 차 바닥 영역 겹침으로 (false = 1차 접점 판정)
  tau_occupy: 0.15          # 차 바닥 면적 대비, 가장 많이 겹친 칸이 이 이상이면 점유 (논문 ③의 15%)
  tau_straddle: 0.3         # 두 번째로 겹친 칸이 이 이상이면 두 칸 모두 침범. 2026-11-22 tune(cam3 연출 구간): 0.3에서 오경보 장면 0

illegal:                    # 3차
  v_stop_mps: 0.3           # 임시값
  t_stop_sec: 60            # 임시값

render:
  height: 720               # Split-View 높이(px)
  video_fps: 4              # 결과 영상 fps (샘플링 2fps면 2배속)
