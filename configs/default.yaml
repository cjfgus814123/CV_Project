# 모든 임계값·크기·모델명은 여기서 읽는다 (CLAUDE.md 10장).
model:
  name: yolo26x-seg.pt      # 2026-11-19 비교: yolo26x가 yolo11x보다 오검출 적음 (11x는 지붕을 truck으로 검출)
  weights_dir: models       # 처음 실행 시 자동 다운로드 (COCO 사전학습)
  imgsz: 1920               # 원본 폭 그대로. 1280 대비 먼 차 신뢰도 0.5~0.6 -> 0.8~0.9, 프레임당 약 120ms
  conf: 0.25
  classes: [2, 5, 7]        # COCO car, bus, truck
  dedup_ios: 0.85           # 작은 박스의 이 비율 이상이 큰 박스와 겹치면 중복 검출로 보고 신뢰도 낮은 쪽 제거

calibration:
  fix_k3: true             # k3 고정: 가장자리 발산 방지 (체커보드가 가장자리를 덜 덮을 때 필수)
  alpha: 1.0               # undistort: 1=원본 픽셀 모두 유지(검은 가장자리), 0=잘라냄

homography:
  ransac_thresh_m: 0.15   # 맵 좌표 기준(m). OpenCV 기본 3.0은 3m라 너무 느슨
  bev_margin_m: 15        # 탑뷰 범위 = 클릭한 점들의 범위 ± 이 값 (∩ 화면 가시 영역)

auto_h:                     # setup_cam.py --auto: 같은 lot 다른 cam을 기준으로 새 촬영 위치의 대응점 자동 추정 (autoh.py)
  sift_features: 8000
  ratio: 0.75               # SIFT 매칭 비율 검사
  ransac_px: 3.0            # 영상 간 바닥 Homography RANSAC (px)
  lot_buffer_m: 3.0         # 기준 프레임에서 맵 칸·통로 범위 + 이 값 안의 특징점만 (바닥)
  min_inliers: 50           # 가장 잘 맞는 기준 cam의 일치점이 이보다 적으면 실패 (손으로 찍기). lotA 실패 쌍 25~31, 성공 82~297
  patch_px: 30              # 국소 정밀화 패치 반지름
  search_px: 24             # 예측 위치 주변 탐색 반경
  min_texture: 5            # 패치 밝기 표준편차가 이보다 작으면 건너뜀
  min_score: 0.6            # 패치 매칭 NCC 최소값
  ransac_m: 0.3             # 정밀화한 점 -> 맵 Homography RANSAC (m)
  val_every: 5              # 자동 대응점 중 이 간격마다 1개를 검증점으로 (재투영 오차용)

sampling:
  fps: 10                   # 검출 fps (2026-11-26: 2 -> 10). 원본 30fps의 약수만 정확 (30/fps 반올림 간격). 정답 프레임(15의 배수)이 들어가려면 2·10·30
                            # 캐시: fps 2 = outputs/<clip>/detections.jsonl, 그 외 = detections_<fps>fps.jsonl

geometry:
  slot_size_m: [2.48, 4.9]  # lotA 실측: 선 중심 간격 2.48 (내부 2.31 + 선 0.17), 줄 끝 칸(A10·B12·C12·D12)은 2.38, 깊이 B·C 4.9 / A·D 4.42
  car_size_m: [1.8, 4.7]    # 2차 footprint용 표준 차 크기
  bev_px_per_m: 20

contact:
  mode: mask_bottom_center  # | bbox_bottom_center | bbox_center | mask_lowest_mean (Laptiev 외 2026: 열마다 가장 아래 픽셀의 맵 평균)
  edge_margin_px: 2         # 박스가 좌·우·아래 경계에서 이 안이면 truncated
  depth_offset_m: 0.9       # 접점을 맵에서 카메라 반대쪽으로 미는 거리 (차 폭 절반). 0 = 원래 설계, 2026-11-22 tune clip 비교로 채택

lot_area:                   # 주차장 영역: 맵의 칸·통로를 감싼 볼록 다각형 + buffer_m. 접점이 밖인 검출은 버림 (뒤편 도로·다른 주차장 차)
  enabled: true
  buffer_m: 3.0

occupancy:
  boundary_tol_m: 0.3       # 임시값: 칸 경계 허용 거리, 튜닝 clip에서 조정
  vis_judge: 0.7            # 가시 비율 >= 이면 판정
  vis_unknown: 0.3          # 가시 비율 < 이면 판단불가(-1)
  smooth_sec: 2.5           # 시간 보정 다수결 창 (초). 프레임 수 = round(초 x 검출 fps), 최소 1. 2fps에서 5프레임 (이전 smooth_n: 5)

quality:                    # (비교용) Laptiev 외 2026 식 (21): 배정 칸 안에 든 접점(열마다 가장 아래 픽셀) 비율 < r_min이면 그 칸 침범(2)
  enabled: false            # contact.mode: mask_lowest_mean, footprint.enabled: false 와 함께 쓴다
  r_min: 0.5                # 논문에 값 없음. 2026-11-26 tune: 0.5~0.9 모두 침범 오경보 89~199장, 오경보가 가장 적은 0.5

footprint:                  # 2차
  method: rect_and_box3d    # rect_and_box3d (기본, 2026-11-26: 점유 = rect, 침범 = rect와 box3d 둘 다 침범인 칸만) | rect (보이는 바닥 경계 + 칸 방향 사각형, 비교용) | box3d (3D 박스 맞추기, 비교용)
  enabled: true             # 2차 적용: 칸 판정을 차 바닥 영역 겹침으로 (false = 1차 접점 판정만, 비교용)
  tau_occupy: 0.2           # 차 바닥 면적 대비 이 이상 겹친 칸은 모두 점유 (선 밟은 차의 옆 칸 포함). 2026-11-25 tune(줄 끝 점 추가한 H)
  crosswise_min_m: 3.0      # 접점이 통로에 있는 차: 보이는 바닥 경계가 칸 폭 방향으로 이 이상이고
  crosswise_ratio: 1.5      #   칸 길이 방향의 이 배 이상이면 가로로 선 차로 보고 사각형을 눕힘
  tau_straddle: 0.25        # 두 번째로 겹친 칸이 이 이상이면 두 칸 모두 침범. 2026-11-25 tune (GT 수정 후): 장면 맞음 27 / 놓침 38 / 오경보 2

box3d:                      # footprint.method: box3d 일 때. 차를 바닥 위 직육면체로 보고 투영이 마스크와 가장 잘 맞는 위치·방향을 찾음
  intrinsics: data/calib/phone_0.5x/calib.json   # 내부 파라미터 K (H와 함께 카메라 자세 복원)
  size_m: [1.8, 4.7, 1.5]   # 폭, 길이, 높이
  angles_deg: [-30, -20, -10, 0, 10, 20, 30, 75, 90, 105]   # 칸 길이 방향 기준 후보 각도
  rotate_gain: 0.15         # 칸 방향 박스보다 IoU가 이만큼 더 높아야 돌린 박스를 씀 (2026-11-26 tune: 0.05/0.1/0.15 중 최선)
  min_iou: 0.55             # 가장 좋은 박스의 IoU가 이보다 낮으면 rect 사각형을 씀

slot_volume:                # (비교용) Masmoudi 외: 칸 3D 상자 중 앞 칸 상자에 안 가려진 부분이 마스크로 덮인 비율 >= tau면 점유
  enabled: false
  height_m: 1.5
  tau: 0.5                  # 2026-11-26 tune 0.2~0.7 중 정확도 최고 (0.866)

track:                      # 3차 ByteTrack (Ultralytics). 검출 캐시(2fps)에 붙임
  high_thresh: 0.25
  low_thresh: 0.1
  new_track_thresh: 0.25
  buffer_sec: 10            # 놓친 트랙 유지 시간 (초). 프레임 수 = 초 x 검출 fps
  match_thresh: 0.8

illegal:                    # 3차
  enabled: true             # 맵에 aisles/no_parking이 있을 때만 동작
  v_stop_mps: 0.3           # 임시값: 최근 window_sec 평균 속도가 이 미만이면 정지
  t_stop_sec: 60            # 임시값: 구역 안 정지가 이만큼 이어지면 불법주차
  window_sec: 5             # 속도 계산 창 (접점 흔들림 0.1~0.3m를 평균으로 눌러줌)

render:
  height: 720               # Split-View 높이(px)
  full_fps: true            # true = 원본 모든 프레임(30fps)에 직전 검출 결과를 덧그려 실제 속도 영상. false = 검출 프레임만
  video_fps: 4              # full_fps: false일 때 결과 영상 fps
